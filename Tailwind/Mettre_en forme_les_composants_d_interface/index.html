<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Catégories</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="flex min-h-screen">
        <aside class="w-64 bg-gray-800 text-white p-6">
            <h2 class="text-xl font-bold mb-8">
                Administration
            </h2>
            <nav class="space-y-2">
                <a href="#"
                   class="block px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-lg">
                    Tableau de bord
                </a>
                <a href="#"
                   class="block px-4 py-2 bg-blue-600 text-white rounded-lg">Catégories</a>
                <a href="#"
                   class="block px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-lg">Articles </a>
                <a href="#"
                   class="block px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-lg">Utilisateurs</a>
            </nav>
        </aside>
        <main class="flex-1">
            <header class="bg-white shadow-sm border-b px-6 py-4">
                <div class="flex items-center justify-between">
                    <h1 class="text-2xl font-bold text-gray-800">Gestion des catégories</h1>
                    <button
                        id="btn-show-form"
                        class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                        Nouvelle catégorie
                    </button>
                </div>
            </header>
            <section class="p-6">
                <div id="section-form"
                     class="bg-white p-6 rounded-lg shadow-sm mb-6">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">
                        Ajouter une catégorie</h2>
                    <form>
                        <div class="mb-4">
                            <label
                                for="nom"
                                class="block text-sm font-medium text-gray-700 mb-2">Nom de la catégorie</label>
                            <input
                                type="text"
                                id="nom"
                                name="nom"
                                placeholder="Entrez le nom"
                                class="border border-gray-300 rounded-lg w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <button
                            type="submit"
                            class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                            Enregistrer
                        </button>
                    </form>
                </div>
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <table class="w-full">
                        <thead>
                            <tr class="bg-gray-50 text-left text-xs text-gray-500 uppercase">
                                <th class="px-6 py-3">
                                    ID
                                </th>

                                <th class="px-6 py-3">Nom</th>

                                <th class="px-6 py-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="border-b hover:bg-gray-50">
                                <td class="px-6 py-4">1</td>
                                <td class="px-6 py-4">Informatique</td>
                                <td class="px-6 py-4">
                                    <button class="text-blue-600 hover:text-blue-800 mr-3">
                                        Modifier
                                    </button>

                                    <button class="text-red-600 hover:text-red-800">
                                        Supprimer
                                    </button>
                                </td>

                            </tr>

                            <tr class="border-b hover:bg-gray-50">

                                <td class="px-6 py-4">
                                    2
                                </td>

                                <td class="px-6 py-4">
                                    Développement Web
                                </td>

                                <td class="px-6 py-4">
                                    <button class="text-blue-600 hover:text-blue-800 mr-3">
                                        Modifier
                                    </button>

                                    <button class="text-red-600 hover:text-red-800">
                                        Supprimer
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
